  - ❓ Cuestionario: cuestionarios/2_0_comportamientos_cuestionario.md
  - 🔬 Experimenta: 2_1_experimenta.md
  - 4. LA CORRIENTE ELÉCTRICA: 3_corriente.md
  - ❓ Cuestionario: cuestionarios/3_corriente_cuestionario.md
  - 5. EL CIRCUITO ELÉCTRICO: 4_circuito_elec.md
  - ❓ Cuestionario: cuestionarios/4_circuito_cuestionario.md
  - 6. COMPONENTES ELÉCTRICOS: 4_1_componentes_elec.md
  - ❓ Cuestionario: cuestionarios/4_1_componentes_cuestionario.md
  - 7. SÍMBOLOS Y ESQUEMAS ELÉCTRICOS: 5_simbolos.md
