  #   - blog/index.md

site_url: https://citius70.github.io/electricidad_nueva-tecnologia-1eso/
repo_url: https://github.com/citius70/electricidad_nueva-tecnologia-1eso.git
repo_name: citius70/electricidad_nueva-tecnologia-1eso

theme:
  navigation_depth: 2
  font:
    text: "Open sans"
    code: Roboto Mono
  features:
    - header.autohide
    - navigation.indexes

  icon:
    repo: fontawesome/brands/git
  name: material
  language: es
  palette:
    primary: indigo
    accent: indigo
    background: white
    foreground: black
    code: dark
  palette:
    
   # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo claro

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
        
   # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a preferencias de sistema



  features:
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - navigation.headings
    - navigation.numbered.headings
    # - navigation.tabs
    - navigation.path
    - navigation.expand
    - navigation.instant
    - navigation.footer
    - navigation.instant.prefetch
    - navigation.sections
    #- toc.follow
    - toc.integrate
    - search.highlight
    - search.suggest



markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - abbr
  - pymdownx.blocks.caption
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra_css.css

extra:
  version:
    provider: mike


plugins:
  - enumerate-headings:
      toc_depth: 0
      strict: true
      increment_across_pages: true
      include:
        - "*"
      exclude:
        - index.md
        - 5_1_esquemas_ejercicios.md
        - 2_1_experimenta.md
        - cuestionarios/*
        - ejercicios/*
        - blog/*
        - 0_actividad_introductoria.md
      # restart_increment_after:
      #   - second_section.md
  - with-pdf:
      author: ALBERTO DURÁN PÉREZ
      copyright: © 2026 Alberto Durán Pérez
      #
      cover: true
      # back_cover: true
      # cover_title: yyyyy
      cover_subtitle: Tecnología y Digitalización - 1º ESO
      #custom_template_path: TEMPLATES PATH
      #
      toc_title:  Tabla de contenidos
      heading_shift: true
      #toc_level: 3
      #ordered_chapter_level: 2
      #excludes_children:
      #    - 'release-notes/:upgrading'
      #    - 'release-notes/:changelog'
      #
      #exclude_pages:
      #    - 'bugs/'
      #    - 'appendix/contribute/'
      #convert_iframe:
      #    - src: IFRAME SRC
      #      img: POSTER IMAGE URL
      #      text: ALTERNATE TEXT
      #    - src: ...
      two_columns_level: 0
      #
      #render_js: true
      #headless_chrome_path: headless-chromium
      #
      #output_path: any-place/document.pdf
      #enabled_if_env: ENABLE_PDF_EXPORT #Activar o desactivar para generar pdf
      #
      #debug_html: true
      #show_anchors: true
      #verbose: true
  - blog:
      blog_dir: blog/
      blog_index_template: blog/index.md
      date_format: DD-MM-YYYY
  - search:
      lang: es
      separator: '[\s\-]+'
  - glightbox:
      include: 
        - "*.md"
  - social:
      background_color: indigo
      image: image/atomo.png
  
